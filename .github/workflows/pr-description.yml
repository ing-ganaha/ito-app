name: PR Description

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr-description:
    if: |
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'renovate' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot' &&
      github.event.pull_request.user.login != 'claude[bot]' &&
      github.event.pull_request.user.login != 'claude'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pr-description-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if merge commit
        id: check_commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ "$COMMIT_MSG" == "Merge pull request"* ]]; then
            echo "is_merge=true" >> $GITHUB_OUTPUT
            echo "Merge commit detected. Skipping description update."
          else
            echo "is_merge=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate and set PR description
        if: steps.check_commit.outputs.is_merge == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(gh pr:*),Bash(gh pr edit:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git fetch:*),Bash(git diff:*),Write,Read"
          prompt: |
            push によって「増えた・減った」変更だけを PR description に反映し、それ以外は触らないでください。

            【前提】PR description の先頭付近に「Parent: ブランチ名」という行がある場合があります。
            Parent 行がある場合はそのブランチを親ブランチとみなし、親ブランチと現在の HEAD との差分だけを対象にしてください。
            Parent 行がない場合は base ブランチと HEAD の差分を対象にしてください。

            1. 現在の PR body を取得する
               - `gh pr view ${{ github.event.pull_request.number }} --json body -q .body` で現在の description を取得する
               - 「Parent: xxx」形式の行を探し、あれば xxx を PARENT_BRANCH として記憶する

            2. 差分を取得する
               - PARENT_BRANCH がある場合:
                 - `git fetch origin ${PARENT_BRANCH}` を実行
                 - `git diff origin/${PARENT_BRANCH}...HEAD` で差分を取得する
               - PARENT_BRANCH がない場合:
                 - `gh pr diff ${{ github.event.pull_request.number }}` で差分を取得する

            3. 「## 変更内容」セクションだけを更新する
               - 今の差分に含まれる変更 → 箇条書きに追加
               - 差分から外れた変更 → 箇条書きから削除
               - 「## 概要」「## 実装方針・補足」「## その他」は変更しない
               - description が空または「## 変更内容」がない場合は以下のフォーマットで初回生成する（日本語）:

            ## 概要
            （この PR で何をしたかを 1〜2 行で）

            ## 変更内容
            - （差分に基づく箇条書き）

            ## 実装方針・補足
            - 特になし

            ## その他
            - 動作確認: （分かる範囲で）
            - テスト: 特になし
            - メモ: （あれば）

            4. 更新内容を PR に反映する
               - 編集した全文を `/tmp/pr_description.md` に保存
               - `gh pr edit ${{ github.event.pull_request.number }} --body-file /tmp/pr_description.md` で更新する
