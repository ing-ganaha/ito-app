name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check if merge commit
        id: check_commit
        run: |
          PARENT_COUNT=$(git log -1 --pretty=%P | wc -w)
          if [ "$PARENT_COUNT" -ge 2 ]; then
            echo "is_merge=true" >> $GITHUB_OUTPUT
            echo "Merge commit detected. Skipping review."
          else
            echo "is_merge=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude Code Review
        id: claude-review
        if: steps.check_commit.outputs.is_merge == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このPRをレビューしてください。

            【評価対象の差分の決め方】
            - PR description の先頭付近に「Parent: ブランチ名」という行がある場合: そのブランチを親とみなし、親ブランチとこのPRのHEADとの差分のみをレビュー対象とする。
            - Parent 行がない場合: この PR の base ブランチと HEAD の差分をレビュー対象とする。
            - main との差分は対象にしない。

            【差分の取得手順】
            1. `gh pr view ${{ github.event.pull_request.number }} --json body,baseRefName` を実行し、PR body から「Parent: xxx」形式の行を探す。
            2. Parent 行があった場合:
               - `gh pr diff` は使用しないこと。
               - `git fetch origin xxx` で親ブランチを取得し、`git diff origin/xxx...HEAD` で差分を取得する。
            3. Parent 行がなかった場合のみ:
               - `gh pr diff ${{ github.event.pull_request.number }}` を使用して差分を取得する。
            4. 上記で得た差分に含まれる行に対してのみインラインコメントする。

            【既存コメントとの重複を避ける】
            レビュー前に以下のコマンドで既存の review thread を取得し、同じファイル・行・観点の指摘は再度出さないこと。
            ```
            gh api graphql \
              -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved path line comments(first:20){nodes{body}}}}}}}' \
              -F owner=${{ github.repository_owner }} -F repo=${{ github.event.repository.name }} -F number=${{ github.event.pull_request.number }} \
              --jq '.data.repository.pullRequest.reviewThreads.nodes[] | {isResolved, path, line, comments: [.comments.nodes[].body]}'
            ```

            以下の観点で確認し、問題があればすべて指摘してください：
            - バグや潜在的な問題
            - セキュリティ上の懸念
            - パフォーマンスの問題
            - PHP/Laravel のベストプラクティスからの逸脱
            - TypeScript/React のベストプラクティスからの逸脱
            - 他ファイルとの一貫性

            問題点がある場合は該当する差分行に対してインラインコメントで指摘すること。問題がなければ「LGTM」とだけ回答してください。
            日本語でレビューしてください。
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git fetch:*),Bash(git diff:*)"
